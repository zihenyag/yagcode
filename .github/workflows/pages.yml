name: pages

"on":
  push:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  build-pages:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.14.0"
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Assert platform
        run: node -e "if (process.platform !== 'linux' || process.arch !== 'x64') process.exit(1)"
      - name: Assert Node
        run: node -e "if (process.versions.node !== '22.14.0') process.exit(1)"
      - name: Assert Python
        run: python -c "import sys; assert sys.version_info[:2] == (3, 12)"
      - name: Install Node dependencies
        run: npm ci
      - name: Create Python venv
        run: python -m venv .venv
      - name: Install Python dependencies
        run: .venv/bin/python -m pip install -e '.[dev]'
      - name: Check landing page
        run: npm run check:landing
      - name: Build Pages artifact
        run: npm run build:pages -- --output dist/pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: dist/pages

  deploy-pages:
    runs-on: ubuntu-24.04
    needs: build-pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

  pages-smoke:
    runs-on: ubuntu-24.04
    needs: deploy-pages
    permissions:
      contents: read
    env:
      YAGCODE_PAGES_URL: ${{ needs.deploy-pages.outputs.page_url }}
      YAGCODE_REQUIRE_DEPLOYED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.14.0"
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Assert platform
        run: node -e "if (process.platform !== 'linux' || process.arch !== 'x64') process.exit(1)"
      - name: Assert Node
        run: node -e "if (process.versions.node !== '22.14.0') process.exit(1)"
      - name: Reject missing deployment URL
        run: test -n "$YAGCODE_PAGES_URL"
      - name: Smoke deployed Pages
        run: npm run check:deployed-pages -- "$YAGCODE_PAGES_URL"
