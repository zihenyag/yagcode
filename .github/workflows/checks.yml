name: offline-checks

"on":
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  offline-checks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.14.0"
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Assert platform
        run: node -e "if (process.platform !== 'linux' || process.arch !== 'x64') process.exit(1)"
      - name: Assert Node
        run: node -e "if (process.versions.node !== '22.14.0') process.exit(1)"
      - name: Assert Python
        run: python -c "import sys; assert sys.version_info[:2] == (3, 12)"
      - name: Install Node dependencies
        run: npm ci
      - name: Create Python venv
        run: python -m venv .venv
      - name: Install Python dependencies
        run: .venv/bin/python -m pip install -e '.[dev]'
      - name: Run Node runner tests
        run: npm run test:runners
      - name: Run Python test suite
        run: npm run test:python
      - name: Lint Python
        run: npm run lint:python
      - name: Typecheck Python
        run: npm run typecheck:python
      - name: Check landing page
        run: npm run check:landing
      - name: Scan framework boundary
        run: npm run scan:framework-boundary
      - name: Scan worktree secrets
        run: npm run scan:secrets
      - name: Run packaging runner tests
        run: npm run test:packaging-runners
      - name: Run delivery runner tests
        run: npm run test:delivery-runners
      - name: Run delivery contract
        run: npm run test:python -- tests/bootstrap/test_delivery_contract.py -q
      - name: Scan worktree and history secrets
        run: npm run scan:secrets -- --scope worktree --scope history
      - name: Check whitespace
        run: git diff --check
