name: platform-build

"on":
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: {}

jobs:
  preflight:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      release_allowed: ${{ steps.release-ref.outputs.release_allowed }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.14.0"
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Assert platform
        run: node -e "if (process.platform !== 'linux' || process.arch !== 'x64') process.exit(1)"
      - name: Assert Node
        run: node -e "if (process.versions.node !== '22.14.0') process.exit(1)"
      - name: Assert Python
        run: python -c "import sys; assert sys.version_info[:2] == (3, 12)"
      - name: Install Node dependencies
        run: npm ci
      - name: Create Python venv
        run: python -m venv .venv
      - name: Install Python dependencies
        run: .venv/bin/python -m pip install -e '.[dev]'
      - name: Check version
        run: npm run check:version
      - name: Check release ref
        run: node scripts/check-release-ref.mjs --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" --sha "$GITHUB_SHA"
      - name: Export release ref
        id: release-ref
        run: |
          node scripts/check-release-ref.mjs --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" --sha "$GITHUB_SHA" | tee release-ref.json
          node -e "const fs=require('fs'); const result=JSON.parse(fs.readFileSync('release-ref.json','utf8')); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'release_allowed=' + String(result.release_allowed) + '\n')"
      - name: Run Node runner tests
        run: npm run test:runners
      - name: Run Python test suite
        run: npm run test:python
      - name: Lint Python
        run: npm run lint:python
      - name: Typecheck Python
        run: npm run typecheck:python
      - name: Check landing page
        run: npm run check:landing
      - name: Scan framework boundary
        run: npm run scan:framework-boundary
      - name: Scan worktree secrets
        run: npm run scan:secrets
      - name: Run packaging runner tests
        run: npm run test:packaging-runners
      - name: Run delivery runner tests
        run: npm run test:delivery-runners
      - name: Run delivery contract
        run: npm run test:python -- tests/bootstrap/test_delivery_contract.py -q
      - name: Scan worktree and history secrets
        run: npm run scan:secrets -- --scope worktree --scope history
      - name: Check whitespace
        run: git diff --check

  build-macos-arm64:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.14.0"
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Assert platform
        run: node -e "if (process.platform !== 'darwin' || process.arch !== 'arm64') process.exit(1)"
      - name: Assert Node
        run: node -e "if (process.versions.node !== '22.14.0') process.exit(1)"
      - name: Assert Python
        run: python -c "import sys; assert sys.version_info[:2] == (3, 12)"
      - name: Install dependencies
        run: npm ci
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[dev]'
      - name: Build desktop package
        run: npm run package:mac
      - name: Build CLI package
        run: npm run package:cli:mac
      - name: Verify desktop manifest
        run: npm run manifest:verify:mac
      - name: Verify CLI manifest
        run: npm run manifest:verify:cli:mac
      - name: Smoke installed desktop
        run: npm run smoke:installed -- --platform darwin-arm64 --manifest dist/manifests/darwin-arm64.json --asset dist/release/yagcode-mac-arm64.dmg
      - name: Smoke CLI
        run: npm run smoke:cli -- --executable dist/cli/darwin-arm64/yagcode-cli/yagcode-cli
      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yagcode-macos-arm64
          path: |
            dist/release/yagcode-mac-arm64.dmg
            dist/release/yagcode-cli-mac-arm64.tar.gz
            dist/manifests/darwin-arm64.json
            dist/manifests/cli-darwin-arm64.json

  build-windows-x64:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.14.0"
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Assert platform
        run: node -e "if (process.platform !== 'win32' || process.arch !== 'x64') process.exit(1)"
      - name: Assert Node
        run: node -e "if (process.versions.node !== '22.14.0') process.exit(1)"
      - name: Assert Python
        run: python -c "import sys; assert sys.version_info[:2] == (3, 12)"
      - name: Install dependencies
        run: npm ci
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install -e '.[dev]'
      - name: Build desktop package
        run: npm run package:win
      - name: Build CLI package
        run: npm run package:cli:win
      - name: Verify desktop manifest
        run: npm run manifest:verify:win
      - name: Verify CLI manifest
        run: npm run manifest:verify:cli:win
      - name: Install desktop package
        run: Start-Process -FilePath dist/release/yagcode-win-x64.exe -ArgumentList "/S", "/D=$PWD\dist\installed\win32-x64\yagcode" -Wait
      - name: Smoke installed desktop
        run: npm run smoke:installed -- --platform win32-x64 --root dist/installed/win32-x64/yagcode
      - name: Smoke CLI
        run: npm run smoke:cli -- --executable dist/cli/win32-x64/yagcode-cli/yagcode-cli.exe
      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yagcode-windows-x64
          path: |
            dist/release/yagcode-win-x64.exe
            dist/release/yagcode-cli-win-x64.zip
            dist/manifests/win32-x64.json
            dist/manifests/cli-win32-x64.json

  release:
    runs-on: ubuntu-24.04
    needs: [preflight, build-macos-arm64, build-windows-x64]
    if: github.event_name == 'push' && needs.preflight.outputs.release_allowed == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.14.0"
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Assert platform
        run: node -e "if (process.platform !== 'linux' || process.arch !== 'x64') process.exit(1)"
      - name: Install dependencies
        run: npm ci
      - name: Create Python venv
        run: python -m venv .venv
      - name: Install Python dependencies
        run: .venv/bin/python -m pip install -e '.[dev]'
      - name: Download macOS artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: yagcode-macos-arm64
          path: dist
      - name: Download Windows artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: yagcode-windows-x64
          path: dist
      - name: Check release ref
        run: node scripts/check-release-ref.mjs --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" --sha "$GITHUB_SHA"
      - name: Check version
        run: npm run check:version
      - name: Merge release manifest
        run: npm run manifest:merge
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/yagcode-mac-arm64.dmg dist/release/yagcode-win-x64.exe dist/release/yagcode-cli-mac-arm64.tar.gz dist/release/yagcode-cli-win-x64.zip dist/release/release-manifest.json --verify-tag --title "YagCode $GITHUB_REF_NAME" --notes-file CHANGELOG.md
